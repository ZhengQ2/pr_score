AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege role that lets GitHub Actions on main publish PR Score files (no infrastructure changes)

Parameters:
  SubjectPrefix:
    Type: String
    Default: repo:ZhengQ2@77452278/pr_score@1373834414
    Description: >-
      OIDC subject prefix for the repository. This repo uses GitHub's immutable subject format
      (owner@id/repo@id); check with `gh api repos/OWNER/REPO/actions/oidc/customization/sub`.
  SiteStackName:
    Type: String
    Default: pr-score-site
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions deploy for PR Score (main branch only)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub '${SubjectPrefix}:ref:refs/heads/main'
      Policies:
        - PolicyName: publish-site-files
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*'
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  - 'arn:aws:s3:::${Bucket}'
                  - Bucket: {'Fn::ImportValue': !Sub '${SiteStackName}-BucketName'}
              - Sid: WriteObjects
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub
                  - 'arn:aws:s3:::${Bucket}/*'
                  - Bucket: {'Fn::ImportValue': !Sub '${SiteStackName}-BucketName'}
              - Sid: Invalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub
                  - 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Dist}'
                  - Dist: {'Fn::ImportValue': !Sub '${SiteStackName}-DistributionId'}

Outputs:
  RoleArn:
    Description: Set as the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
